# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Usva

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install, check, test and build
        run: |
          npm ci
          npm run typecheck
          npm run test
          npm run build

      # Next.js builds a self-contained server into .next/standalone. The static
      # assets are not copied there automatically, and the package must start
      # with "npm start" on App Service, so assemble it here and zip it: a zip
      # keeps the hidden .next folder, which a plain artifact upload would drop.
      - name: Assemble deployment package
        run: |
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          cd .next/standalone
          npm pkg set scripts.start="HOSTNAME=0.0.0.0 node server.js"
          zip -qr ../../release.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7F5DC28C95894454BDC9707A4E45B4E7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A5C987BE544345B4B93A5BB43C84F5A1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A70ABA1F6ABD4FA6B83F5E5C2442D339 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Usva'
          slot-name: 'Production'
          package: release.zip
          # Remove the previous version's files and restart the app, so the
          # running server can never keep serving an older build.
          clean: true
          restart: true
          